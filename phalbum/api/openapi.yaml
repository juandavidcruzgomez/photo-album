openapi: 3.0.3
info:
  title: Photo album search API
  version: 0.1.0
  description: |
    Search photos by description (CLIP text), by picture (upload or "more like
    this"), filter by tags and dates, and manage tags. No authentication yet.

    Similarity searches return results ranked by `score` (cosine similarity,
    roughly 0.15–0.35 for text queries with CLIP). Without a query, photos are
    listed newest first by `captured_at` (EXIF date, falling back to the file
    date).
servers:
  - url: http://localhost:8090
security: [] # no authentication yet

paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Health check (database reachable)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }
        "503": { description: Database unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }

  /api/photos:
    get:
      operationId: listPhotos
      summary: Browse or search photos
      description: |
        `q` and `similar_to` can be combined; their embeddings are averaged.
        Without either, photos are listed newest first.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 'Free-text description, e.g. "a dog on the beach"' }
        - { name: similar_to, in: query, schema: { type: string, format: uuid }, description: Photo id for "more like this" }
        - $ref: "#/components/parameters/Tags"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200": { description: A page of photos, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/photos/search:
    post:
      operationId: searchByImage
      summary: Search by an uploaded picture
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: "JPEG, PNG, GIF, WebP, BMP or TIFF, up to 20 MB" }
                q: { type: string, description: "Optional text, combined with the image" }
                tags: { type: string, description: Comma-separated; all must match }
                from: { type: string, format: date }
                to: { type: string, format: date }
                sort: { type: string, enum: [desc, asc] }
                limit: { type: integer }
                offset: { type: integer }
      responses:
        "200": { description: A page of photos, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoList" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/photos/tags:
    post:
      operationId: tagPhotos
      summary: Add and remove tags on several photos at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photo_ids]
              properties:
                photo_ids: { type: array, items: { type: string, format: uuid } }
                add: { type: array, items: { type: string }, description: "Tag names, created if needed" }
                remove: { type: array, items: { type: integer, format: int64 }, description: Tag ids }
      responses:
        "204": { description: Done }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/years:
    get:
      operationId: listYears
      summary: Photo counts per capture year, newest first
      description: Photos without a date are not counted. Accepts the same tag and date filters as listPhotos.
      parameters:
        - $ref: "#/components/parameters/Tags"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Years
          content:
            application/json:
              schema: { type: object, required: [years], properties: { years: { type: array, items: { $ref: "#/components/schemas/YearCount" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/photos/{id}:
    get:
      operationId: getPhoto
      summary: Photo details
      parameters: [{ $ref: "#/components/parameters/PhotoID" }]
      responses:
        "200": { description: The photo, content: { application/json: { schema: { $ref: "#/components/schemas/PhotoDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/photos/{id}/thumbnail:
    get:
      operationId: getThumbnail
      summary: JPEG thumbnail (max 512 px), cacheable forever
      parameters: [{ $ref: "#/components/parameters/PhotoID" }]
      responses:
        "200": { description: Image, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/photos/{id}/original:
    get:
      operationId: getOriginal
      summary: Original file
      description: From object storage when originals are stored, otherwise from the first source path still on disk. Supports range requests when served from disk.
      parameters: [{ $ref: "#/components/parameters/PhotoID" }]
      responses:
        "200": { description: Image, content: { image/*: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/photos/{id}/tags:
    post:
      operationId: tagPhoto
      summary: Add a tag to a photo (created if needed)
      parameters: [{ $ref: "#/components/parameters/PhotoID" }]
      requestBody: { $ref: "#/components/requestBodies/TagName" }
      responses:
        "200": { description: The attached tag, content: { application/json: { schema: { $ref: "#/components/schemas/TagRef" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/photos/{id}/tags/{tagID}:
    delete:
      operationId: untagPhoto
      summary: Remove a tag from a photo (the tag itself is kept)
      parameters: [{ $ref: "#/components/parameters/PhotoID" }, { $ref: "#/components/parameters/TagIDNamed" }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/tags:
    get:
      operationId: listTags
      summary: All tags with photo counts
      responses:
        "200":
          description: Tags, alphabetically
          content:
            application/json:
              schema: { type: object, required: [tags], properties: { tags: { type: array, items: { $ref: "#/components/schemas/Tag" } } } }
    post:
      operationId: createTag
      summary: Create a tag (returns the existing one if the name matches, case-insensitively)
      requestBody: { $ref: "#/components/requestBodies/TagName" }
      responses:
        "200": { description: The tag, content: { application/json: { schema: { $ref: "#/components/schemas/Tag" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/tags/{id}:
    patch:
      operationId: renameTag
      summary: Rename a tag
      parameters: [{ $ref: "#/components/parameters/TagID" }]
      requestBody: { $ref: "#/components/requestBodies/TagName" }
      responses:
        "200": { description: The tag, content: { application/json: { schema: { $ref: "#/components/schemas/Tag" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Another tag already has that name, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      operationId: deleteTag
      summary: Delete a tag and remove it from all photos
      parameters: [{ $ref: "#/components/parameters/TagID" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  parameters:
    PhotoID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    TagID: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    TagIDNamed: { name: tagID, in: path, required: true, schema: { type: integer, format: int64 } }
    Tags:
      name: tags
      in: query
      description: Comma-separated tag names (or repeat the parameter); photos must have all of them. Case-insensitive.
      schema: { type: string }
    From: { name: from, in: query, description: "Inclusive start date (YYYY-MM-DD or RFC 3339)", schema: { type: string } }
    To: { name: to, in: query, description: "Inclusive end date; a bare date includes the whole day", schema: { type: string } }
    Sort:
      name: sort
      in: query
      description: Date order when listing (ignored for similarity searches). Default newest first.
      schema: { type: string, enum: [desc, asc], default: desc }
    Limit: { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
    Offset: { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }

  requestBodies:
    TagName:
      required: true
      content:
        application/json:
          schema: { type: object, required: [name], properties: { name: { type: string } } }

  responses:
    BadRequest: { description: Invalid input, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties: { error: { type: string } }
    Status:
      type: object
      properties: { status: { type: string }, error: { type: string } }
    TagRef:
      type: object
      required: [id, name, source]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        source: { type: string, enum: [path, user, auto], description: "path = folder name from the crawler, user = added by hand" }
    Tag:
      type: object
      required: [id, name, photos]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        photos: { type: integer }
    Photo:
      type: object
      required: [id, filename, width, height, captured_at, taken_at, tags, thumbnail_url, original_url]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        width: { type: integer }
        height: { type: integer }
        captured_at: { type: string, format: date-time, nullable: true }
        taken_at: { type: string, format: date-time, nullable: true, description: From EXIF only }
        camera_model: { type: string }
        tags: { type: array, items: { $ref: "#/components/schemas/TagRef" } }
        score: { type: number, description: "Similarity, only present for searches" }
        thumbnail_url: { type: string }
        original_url: { type: string }
    YearCount:
      type: object
      required: [year, photos]
      properties:
        year: { type: integer }
        photos: { type: integer }
    PhotoList:
      type: object
      required: [photos, next_offset]
      properties:
        photos: { type: array, items: { $ref: "#/components/schemas/Photo" } }
        next_offset: { type: integer, nullable: true, description: "Offset of the next page, null on the last page" }
    PhotoDetail:
      allOf:
        - $ref: "#/components/schemas/Photo"
        - type: object
          required: [mime_type, extension, size, paths, has_original, indexed_at]
          properties:
            mime_type: { type: string }
            extension: { type: string }
            size: { type: integer, format: int64 }
            camera_make: { type: string }
            latitude: { type: number }
            longitude: { type: number }
            exif: { type: object, additionalProperties: { type: string } }
            paths: { type: array, items: { type: string }, description: Where the crawler found this content }
            has_original: { type: boolean, description: Whether the original is in object storage }
            indexed_at: { type: string, format: date-time }
