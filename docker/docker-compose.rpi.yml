# The Raspberry Pi side of the split deployment: database, storage, api with the
# web UI, and crawler. The indexer runs on another machine, using
# docker-compose.indexer.yml, and reaches Postgres and S3 over the LAN. See
# "Raspberry Pi + PC" in the README.
#
# Tuned for 1 GB of RAM. The images are built on the PC and loaded here by
# `make rpi-deploy`:
#   docker compose --env-file rpi.env -f docker-compose.rpi.yml up -d

name: phalbum-rpi

x-phalbum: &phalbum
  environment:
    PHOTOS_ROOT: ${PHOTOS_ROOT:?}
    POSTGRES_USER: ${POSTGRES_USER:?}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    POSTGRES_DB: ${POSTGRES_DB:-postgres}
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    S3_ENDPOINT: http://seaweedfs:8333
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    ONNX_THREADS: ${ONNX_THREADS:-2}
    CLIP_DISABLE_VISION: ${CLIP_DISABLE_VISION:-false}
  # The owner of the photos, so private directories (mode 700) are readable.
  user: "${PHOTOS_UID:-1000}:${PHOTOS_GID:-1000}"
  volumes:
    - ${PHOTOS_ROOT:?}:${PHOTOS_ROOT:?}:ro
  depends_on:
    db:
      condition: service_healthy
    seaweedfs:
      condition: service_started

services:

  # Postgres, reachable by the indexer on the LAN.
  db:
    image: pgvector/pgvector:pg14
    restart: unless-stopped
    mem_limit: 256m
    shm_size: 64mb
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=256MB
      - -c
      - max_connections=30
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - ${DATA_DIR:?}/db:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Master, volume, filer and S3 in one process, to save memory. Only S3 is
  # published; it requires the keys in s3.json.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    mem_limit: 256m
    # Bounded upload buffers and caches: large originals otherwise exceed mem_limit.
    environment:
      GOMEMLIMIT: 200MiB
      GOGC: "50"
    command: >-
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024 -volume.max=0 -volume.index=leveldb
      -volume.concurrentUploadLimitMB=64 -filer -filer.concurrentUploadLimitMB=64
      -s3 -s3.config=/etc/seaweedfs/s3.json -s3.concurrentUploadLimitMB=64
      -s3.cacheCapacityMB=16 -s3.readerCacheSizeMB=32
    volumes:
      - ${DATA_DIR:?}/seaweedfs:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - 8333:8333

  # Search API and web UI on http://<this machine>:8090
  api:
    <<: *phalbum
    image: phalbum-api:arm64
    pull_policy: never
    restart: unless-stopped
    mem_limit: 600m
    ports:
      - 8090:8090

  # On demand, not started by `up`:
  #   docker compose --env-file rpi.env -f docker-compose.rpi.yml run --rm crawler /path/under/PHOTOS_ROOT
  crawler:
    <<: *phalbum
    image: phalbum-crawler:arm64
    pull_policy: never
    mem_limit: 256m
    profiles: [tools]
